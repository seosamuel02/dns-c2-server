<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Login - DNS C2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        html, body {
            height: 100%;
        }
        body {
            display: flex;
            align-items: center;
            padding-top: 40px;
            padding-bottom: 40px;
            background-color: #2c3034;
            color: #f8f9fa;
        }
        .form-signin {
            width: 100%;
            max-width: 420px;
            padding: 25px; /* 패딩 증가 */
            margin: auto;
            background-color: #343a40;
            border: 1px solid #454d55;
            border-radius: 0.5rem;
            text-align: center;
        }
        .form-signin .form-control {
            position: relative;
            box-sizing: border-box;
            height: auto;
            padding: 10px;
            font-size: 16px;
            background-color: #454d55;
            color: #f8f9fa;
            border-color: #6c757d;
        }
        .form-signin .form-control:focus {
            z-index: 2;
            border-color: #00beef;
            box-shadow: 0 0 0 0.2rem rgba(0, 190, 239, 0.25);
        }
        .form-signin input[type="text"] {
            margin-bottom: -1px;
            border-bottom-right-radius: 0;
            border-bottom-left-radius: 0;
        }
        .form-signin input[type="password"] {
            margin-bottom: 20px; /* 버튼과의 간격 증가 */
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }
        .btn-primary { background-color: #00beef; border-color: #00beef; font-weight: bold; }
        .btn-primary:hover { background-color: #00a0c7; border-color: #00a0c7; }
        
        /* [수정] 로고 이미지 스타일: 원본 비율을 유지하도록 변경 */
        .logo {
            max-width: 220px;  /* 최대 가로 너비 지정 (적절히 조절) */
            height: auto;      /* 세로 비율은 자동으로 조절 */
            margin-bottom: 25px; /* 아래쪽 여백 증가 */
        }
    </style>
</head>
<body>
    <form class="form-signin" method="post">
        <img class="logo" src="{{ url_for('static', filename='images/ccit.png') }}" alt="Logo">
        
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        
        <label for="inputUsername" class="sr-only">Username</label>
        <input type="text" id="inputUsername" name="username" class="form-control" placeholder="Username" required autofocus>
        
        <label for="inputPassword" class="sr-only">Password</label>
        <input type="password" id="inputPassword" name="password" class="form-control" placeholder="Password" required>
        
        <button class="btn btn-lg btn-primary btn-block" type="submit">Sign In</button>
        <p class="mt-5 mb-3 text-muted">&copy; DNS C2 - 2025</p>
    </form>
</body>
</html>
